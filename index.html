<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎃 Halloween</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#start {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 25px;
    text-align: center;
    cursor: pointer;
}

#scare {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    align-items: center;
    justify-content: center;
}

#face {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

#flash {
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
}
</style>
</head>

<body>

<div id="start">
    <div>
        👻<br><br>
        Clique ici pour continuer...
    </div>
</div>

<div id="scare">
    <img id="face">
</div>

<div id="flash"></div>

<script>

document.getElementById("start").onclick = function() {

    const svg = `
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">

    <rect width="1000" height="1000" fill="black"/>

    <ellipse cx="500" cy="500"
             rx="350" ry="440"
             fill="#ddd"/>

    <ellipse cx="380" cy="430"
             rx="95" ry="140"
             fill="black"/>

    <ellipse cx="620" cy="430"
             rx="95" ry="140"
             fill="black"/>

    <ellipse cx="390" cy="450"
             rx="20" ry="50"
             fill="red"/>

    <ellipse cx="610" cy="450"
             rx="20" ry="50"
             fill="red"/>

    <path d="M300 680
             Q500 850 700 680
             Q650 930 500 930
             Q350 930 300 680"
          fill="black"/>

    <path d="M350 720
             L380 820
             L420 740
             L460 840
             L500 750
             L540 840
             L580 740
             L620 820
             L650 720"
          fill="white"/>

    <text x="500" y="980"
          text-anchor="middle"
          fill="white"
          font-size="35"
          font-family="serif">
          JE T'AI VU.
    </text>

    </svg>
    `;

    document.getElementById("face").src =
        "data:image/svg+xml;charset=utf-8," +
        encodeURIComponent(svg);

    document.getElementById("flash").style.opacity = "1";

    setTimeout(function() {

        document.getElementById("flash").style.opacity = "0";

        document.getElementById("start").style.display = "none";

        document.getElementById("scare").style.display = "flex";

        if (navigator.vibrate) {
            navigator.vibrate([100,50,200,50,400]);
        }

    }, 100);

};

</script>

</body>
</html>
